<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Outer Aura Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#auraGlow)" stroke-width="8" opacity="0.4" stroke-dasharray="12 8" />
  <!-- Glowing Orbit Circle -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#auraGlow)" stroke-width="12" filter="url(#glow)" />
  <!-- Inner Neural Core -->
  <circle cx="256" cy="256" r="64" fill="url(#auraGlow)" opacity="0.9" />
  <circle cx="256" cy="256" r="36" fill="#ffffff" />
  <!-- Sparkles / Nodes -->
  <circle cx="170" cy="180" r="10" fill="#38bdf8" />
  <circle cx="342" cy="180" r="10" fill="#c084fc" />
  <circle cx="256" cy="376" r="12" fill="#818cf8" />
  <path d="M170 180 L256 220 L342 180" stroke="#ffffff" stroke-width="3" opacity="0.7" fill="none" />
  <path d="M256 292 L256 376" stroke="#ffffff" stroke-width="3" opacity="0.7" fill="none" />
</svg>
